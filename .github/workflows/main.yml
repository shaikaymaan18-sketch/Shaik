name: Build Eden APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive 

      - name: Install C++ Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build ccache libvulkan-dev glslang-dev glslang-tools

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Force NDK Downgrade and Build
        run: |
          GRADLE_DIR=$(dirname $(find . -name gradlew | head -n 1))
          echo "Found gradlew in: $GRADLE_DIR"
          cd "$GRADLE_DIR"
          
          # Aggressively rewrite the hardcoded NDK version in all gradle files to 26.1
          find . -name "*.gradle*" -exec sed -i 's/ndkVersion.*/ndkVersion "26.1.10909125"/g' {} +
          
          chmod +x ./gradlew
          ./gradlew assembleRelease -Pandroid.injected.build.abi=arm64-v8a --info --no-daemon

      - name: Print CMake Error Logs on Failure
        if: failure()
        run: |
          echo "==== CMAKE ERROR LOG ===="
          find . -name "CMakeError.log" -exec cat {} + || echo "No CMakeError.log found"
          echo "==== CMAKE OUTPUT LOG ===="
          find . -name "CMakeOutput.log" -exec cat {} + || echo "No CMakeOutput.log found"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Eden-Mali-Build
          path: '**/build/outputs/apk/release/*.apk'
          
