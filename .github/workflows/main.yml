name: Build Eden APK

on:
  push:
    branches: [ "main", "master", "2ndAdjustmentVulkanv2" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive 

      - name: Maximize Server RAM (Bypass OS Lock)
        run: |
          sudo swapoff -a
          sudo rm -f /swapfile
          sudo fallocate -l 10G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=10240 status=progress
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          echo "Memory setup complete. 10GB Swap available for C++ Linking:"
          free -h

      - name: Install C++ Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build ccache libvulkan-dev glslang-dev glslang-tools

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK (Native NDK 28)
        run: |
          GRADLE_DIR=$(dirname $(find . -name gradlew | head -n 1))
          cd "$GRADLE_DIR"
          chmod +x ./gradlew
          
          # Added the custom artifacts copy task native to the Eden codebase
          ./gradlew assembleRelWithDebInfo copyMainlineRelWithDebInfoOutputs -Pandroid.injected.build.abi=arm64-v8a -Dorg.gradle.jvmargs="-Xmx2g" --info --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Eden-Mali-Build
          # GitHub will now look in the custom artifacts directory!
          path: '**/artifacts/*.apk'
          
