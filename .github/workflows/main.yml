name: Build Eden APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive 

      - name: Maximize Server RAM (Prevent OOM Kills)
        run: |
          # Create the swap in /mnt with a unique name so we don't collide with the active system swap
          sudo fallocate -l 10G /mnt/eden_swap || sudo dd if=/dev/zero of=/mnt/eden_swap bs=1M count=10240 status=progress
          sudo chmod 600 /mnt/eden_swap
          sudo mkswap /mnt/eden_swap
          sudo swapon /mnt/eden_swap
          echo "Memory setup complete:"
          free -h

      - name: Install C++ Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build ccache libvulkan-dev glslang-dev glslang-tools

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Force NDK Downgrade and Build
        run: |
          GRADLE_DIR=$(dirname $(find . -name gradlew | head -n 1))
          echo "Found gradlew in: $GRADLE_DIR"
          cd "$GRADLE_DIR"
          
          # Force stable NDK
          find . -name "*.gradle*" -exec sed -i 's/ndkVersion.*/ndkVersion = "26.1.10909125"/g' {} +
          
          chmod +x ./gradlew
          
          # Restrict Java to 2GB RAM, saving the rest for C++
          ./gradlew assembleRelease -Pandroid.injected.build.abi=arm64-v8a -Dorg.gradle.jvmargs="-Xmx2g" --info --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Eden-Mali-Build
          path: '**/build/outputs/apk/release/*.apk'
          
