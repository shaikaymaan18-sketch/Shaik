name: Build Eden APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive 

      - name: Maximize Server RAM (Bypass OS Lock)
        run: |
          # Turn off the active OS swap to release the "Text file busy" lock
          sudo swapoff -a
          sudo rm -f /swapfile
          
          # Create a massive 10GB swap file safely
          sudo fallocate -l 10G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          echo "Memory setup complete. 10GB Swap available for C++ Linking:"
          free -h

      - name: Install C++ Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build ccache libvulkan-dev glslang-dev glslang-tools

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Force NDK Downgrade and Build
        run: |
          # Automatically navigate into the nested src/android directory
          GRADLE_DIR=$(dirname $(find . -name gradlew | head -n 1))
          cd "$GRADLE_DIR"
          
          # Inject the exact NDK downgrade specifically for Kotlin DSL (.kts) scripts
          find . -name "*.gradle.kts" -exec sed -i 's/ndkVersion.*/ndkVersion = "26.1.10909125"/g' {} +
          
          chmod +x ./gradlew
          
          # Force ARM64 target, cap JVM memory at 2GB, and compile
          ./gradlew assembleRelease -Pandroid.injected.build.abi=arm64-v8a -Dorg.gradle.jvmargs="-Xmx2g" --info --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Eden-Mali-Build
          path: '**/build/outputs/apk/release/*.apk'
          
