name: Build Eden APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive 

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Find Gradle and Build APK
        env:
          # Force the build to use the highly-stable NDK 26.1 instead of NDK 28
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/26.1.10909125
        run: |
          GRADLE_DIR=$(dirname $(find . -name gradlew | head -n 1))
          echo "Found gradlew in: $GRADLE_DIR"
          
          cd "$GRADLE_DIR"
          chmod +x ./gradlew
          
          # Added --info to expose hidden C++ compile errors and forced the NDK version
          ./gradlew assembleRelease -Pandroid.injected.build.abi=arm64-v8a -Pandroid.ndkVersion=26.1.10909125 --info --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: always() # Ensures the artifact uploads even if something fails
        with:
          name: Eden-Mali-Build
          path: '**/build/outputs/apk/release/*.apk'
          
