name: Build Eden APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive 

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Find Gradle and Build APK
        run: |
          # Automatically find the directory containing gradlew
          GRADLE_DIR=$(dirname $(find . -name gradlew | head -n 1))
          echo "Found gradlew in: $GRADLE_DIR"
          
          cd "$GRADLE_DIR"
          chmod +x ./gradlew
          
          # Inject arm64-v8a parameter to prevent CMake from crashing on x86_64 builds
          ./gradlew assembleRelease -Pandroid.injected.build.abi=arm64-v8a --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Eden-Mali-Build
          path: '**/build/outputs/apk/release/*.apk'
          
